# Forge CI for this staging mirror.
#
# Deliberately NOT a copy of upstream's build matrix. Upstream runs Linux clang/gcc,
# Windows MSVC/clang and macOS Intel/ARM on every pull request, and macOS is hardware
# this homelab does not have. What this runs instead is the set that catches problems
# BEFORE a submission exists: formatting and lint, a Linux build plus unit tests, and
# an MSVC build.
#
# MSVC is here because it is the one compiler whose disagreements with clang are not
# caught by any other job in this file (/permissive-, two-phase lookup, missing
# transitive includes). Finding those only after an upstream pull request goes red
# costs a fix and a force-push on someone else's tracker.
#
# The earlier version of this comment rejected a Windows VM on the grounds that its
# cost was attributable to this one repository. That is no longer true: Proteus is
# maintained for launcher packaging and .NET work regardless, so this job is a
# marginal consumer of a host that already exists. Windows-clang is still skipped as
# redundant with the Linux clang job, and macOS is still uncovered.
#
# Runner: proteus-windows, instance-level, labels windows-2022 / windows-latest /
# windows / self-hosted, host backend (no container isolation).
#
# Forgejo prefers .forgejo/workflows over .github/workflows, but that preference is
# resolved PER REF, not repository-wide. A ref carrying no .forgejo/workflows directory
# falls back to .github/workflows and runs upstream's matrix in full, which here fails in
# seconds against windows-2022 and macos-15 labels that no runner provides. Only develop
# carries this file, so only develop is covered by the preference.
#
# What keeps that fallback from firing on pull requests is upstream's own trigger filter:
# every workflow in .github/workflows is `branches: [master]`, and for a pull_request that
# filter matches the BASE ref. So a pull request based on develop cannot match them, while
# one based on master runs the whole matrix red. Base forge pull requests on develop.
#
# Runner: atlas-ci, instance-level, labels ubuntu-22.04 / ubuntu-latest / self-hosted,
# backed by catthehacker/ubuntu:act-22.04.

name: Forge CI

on:
  push:
    branches:
      - develop

  # pull_request_target, not pull_request, and the reason is structural. Branches here are
  # cut from master so their upstream diff stays clean, and master deliberately does not
  # carry this file. A pull_request event resolves the workflow from the HEAD ref, which
  # therefore does not have it; worse than getting no CI, that falls back to
  # .github/workflows and runs upstream's matrix. pull_request_target resolves from the
  # BASE ref, which is develop, which does have it.
  #
  # The tradeoff is real: pull_request_target runs with the base repository's context, and
  # the checkout below deliberately takes the pull request's head so that the code under
  # test is the code being proposed. That means untrusted code would run with that context.
  # Acceptable here because this repository has exactly one collaborator and accepts no
  # external contributions. Revisit if that ever changes.
  pull_request_target:

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # On pull_request_target the default checkout is the BASE. Take the head so the
          # run tests the proposed change; fall back to github.sha for push events.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # Pinned to 18 on purpose. Later clang-format releases disagree with this codebase
      # (braced-init-list bin packing, among others) and will fail a clean tree, so a
      # newer one produces false failures and, worse, reformats code that CI then rejects.
      #
      # Installed from PyPI rather than apt. Upstream's job does `apt install
      # clang-format-18`, which only works because GitHub's hosted ubuntu-22.04 image
      # ships the LLVM apt sources pre-configured. Jammy's own repos stop at 14, so on a
      # stock 22.04 container that install fails with "Unable to locate package". The
      # wheel delivers the identical binary with no apt source wrangling.
      - name: Install clang-format 18
        run: |
          python3 -m pip install --quiet --user clang-format==18.1.8
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Assert the version rather than trust it: the whole point of pinning is defeated
      # if some other clang-format wins on PATH.
      - name: Verify clang-format version
        run: |
          set -e
          got="$("$HOME/.local/bin/clang-format" --version)"
          echo "$got"
          case "$got" in
            *"version 18."*) ;;
            *) echo "FATAL: expected clang-format 18.x, got: $got" >&2; exit 1 ;;
          esac

      - name: Check formatting
        run: |
          chmod +x ./third-party/run-clang-format/run-clang-format.py
          ./third-party/run-clang-format/run-clang-format.py \
            -r common decompiler game goalc test tools lsp \
            --color always \
            --clang-format-executable "$HOME/.local/bin/clang-format"

      - name: Required checks
        run: |
          python3 ./scripts/ci/lint-trailing-whitespace.py
          python3 ./scripts/gsrc/check-for-conflicts.py
          python3 ./scripts/ci/check-for-asserts.py
          python3 ./scripts/ci/lint-characters.py
          python3 ./scripts/ci/lint-autoglottonyms.py

  build-and-test:
    name: Linux clang build and unit tests
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # On pull_request_target the default checkout is the BASE. Take the head so the
          # run tests the proposed change; fall back to github.sha for push events.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang gcc g++ lcov make \
            nasm libxrandr-dev libxinerama-dev libxcursor-dev libpulse-dev \
            libxi-dev zip ninja-build libgl1-mesa-dev libssl-dev

      # No sccache here. Upstream's setup uses GitHub's hosted Actions Cache service,
      # which this instance does not provide. Atlas has the cores to absorb a cold build.
      #
      # Release-linux-clang rather than upstream's -asan variant: ASAN roughly doubles
      # build time and slows the test run considerably, and its value is finding
      # memory errors that upstream's matrix will catch at submission anyway.
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake -B build --preset=Release-linux-clang

      - name: Build
        run: cmake --build build --parallel $(nproc)

      # 1509 tests, no ISO data required, no GPU required.
      - name: Unit tests
        run: ./build/goalc-test --gtest_color=yes --gtest_filter="-*MANUAL_TEST*"

  windows-msvc:
    name: Windows MSVC
    uses: ./.github/workflows/windows-build-msvc.yaml
    with:
      # Must match a real preset name in CMakePresets.json. Upstream's own
      # build-matrix.yaml passes exactly this; a bare "Release" is not a preset
      # and cmake fails at generation time.
      cmakePreset: "Release-windows-msvc"
      cachePrefix: "forge"
